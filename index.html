<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Synthesis | Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --gold: #d4af37; --deep-navy: #0f172a; }
        body { font-family: 'Inter', sans-serif; background-color: #fbfbfb; color: var(--deep-navy); scroll-behavior: smooth; overflow-x: hidden; }
        .serif { font-family: 'Playfair Display', serif; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide { animation: slideIn 0.4s ease-out forwards; }
        
        .profile-gradient { background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%); }
        
        #chat-sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(100%);
        }
        #chat-sidebar.open { transform: translateX(0); }

        .loading-spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid #000;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased">

<!-- GLOBAL NAVIGATION -->
<nav class="fixed top-0 w-full z-50 glass px-6 py-4 flex justify-between items-center">
    <div class="text-2xl font-bold serif italic cursor-pointer" onclick="showView('home')">The Synthesis.</div>
    
    <div class="flex items-center gap-6">
        <button id="msgBtn" class="hidden text-stone-600 hover:text-stone-900 relative">
            <i data-lucide="message-square"></i>
            <span class="absolute -top-1 -right-1 w-2 h-2 bg-amber-500 rounded-full"></span>
        </button>
        <button id="profileNavBtn" onclick="showView('onboarding')" class="bg-stone-900 text-white px-6 py-2 rounded-full text-xs font-bold hover:bg-stone-700 transition">JOIN</button>
    </div>
</nav>

<!-- MAIN CONTENT -->
<main class="pt-32 pb-20 px-6 max-w-7xl mx-auto">
    
    <!-- HOME VIEW -->
    <div id="view-home" class="view block text-center py-20 animate-slide">
        <h1 class="text-5xl md:text-8xl font-bold serif italic mb-8">Synchronize with the World.</h1>
        <p class="text-lg text-stone-500 max-w-xl mx-auto mb-12">An encrypted matchmaking protocol for the global creative class.</p>
        <button onclick="showView('onboarding')" class="bg-stone-900 text-white px-12 py-5 rounded-full font-bold shadow-2xl hover:scale-105 transition">ENTER THE PORTAL</button>
    </div>

    <!-- ONBOARDING VIEW -->
    <div id="view-onboarding" class="view hidden max-w-lg mx-auto bg-white p-10 rounded-[3rem] shadow-xl border border-stone-100 animate-slide">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold serif italic">Initialize Identity</h2>
            <p class="text-stone-400 text-xs mt-2 font-bold tracking-widest uppercase">Direct Google Sync</p>
        </div>
        
        <button id="googleBtn" class="w-full py-4 border-2 border-stone-100 rounded-2xl font-bold flex items-center justify-center gap-3 text-stone-700 hover:bg-stone-50 transition mb-6">
            <div id="googleBtnContent" class="flex items-center gap-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Verify with Google
            </div>
            <div id="googleBtnLoading" class="hidden loading-spinner"></div>
        </button>

        <div class="relative flex py-5 items-center">
            <div class="flex-grow border-t border-stone-200"></div>
            <span class="flex-shrink mx-4 text-stone-400 text-[10px] font-bold">OR MANUAL</span>
            <div class="flex-grow border-t border-stone-200"></div>
        </div>

        <form id="onboardingForm" class="space-y-4">
            <input type="text" id="userName" placeholder="Custom Alias" class="w-full px-6 py-4 rounded-2xl border border-stone-100 bg-stone-50 outline-none">
            <select id="userRegion" class="w-full px-6 py-4 rounded-2xl border border-stone-100 bg-stone-50 outline-none">
                <option value="Global">Select Region</option>
                <option value="USA">USA</option>
                <option value="Europe">Europe</option>
                <option value="Asia">Asia</option>
                <option value="India">India</option>
            </select>
            <button type="submit" class="w-full py-5 bg-stone-900 text-white rounded-2xl font-bold">START DISCOVERY</button>
        </form>
    </div>

    <!-- PORTAL VIEW -->
    <div id="view-portal" class="view hidden animate-slide">
        <h2 class="text-4xl font-bold serif italic mb-8">Global Discoveries</h2>
        <div id="memberGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
             <div class="col-span-full py-20 text-center text-stone-400 italic">Syncing identities...</div>
        </div>
    </div>

    <!-- PROFILE VIEW (INSTAGRAM STYLE) -->
    <div id="view-profile" class="view hidden max-w-4xl mx-auto animate-slide">
        <div class="bg-white rounded-[3rem] shadow-xl overflow-hidden border border-stone-100">
            <div class="h-48 bg-stone-900 relative">
                 <button onclick="showView('portal')" class="absolute top-6 left-6 text-white bg-black/20 p-2 rounded-full hover:bg-black/40"><i data-lucide="arrow-left"></i></button>
            </div>
            <div class="px-10 pb-10">
                <div class="flex flex-col md:flex-row items-end -mt-20 gap-8 mb-10">
                    <div class="w-40 h-40 rounded-full border-8 border-white bg-stone-200 overflow-hidden shadow-lg">
                        <img id="profile-view-img" src="" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 pb-4">
                        <div class="flex flex-wrap items-center gap-4 mb-2">
                            <h2 id="profile-view-name" class="text-3xl font-bold serif italic">Member</h2>
                            <button class="px-6 py-2 bg-stone-900 text-white rounded-full text-xs font-bold">Follow</button>
                            <button class="px-6 py-2 border-2 border-stone-100 rounded-full text-xs font-bold">Message</button>
                        </div>
                        <p id="profile-view-region" class="text-stone-400 font-bold tracking-widest uppercase text-xs">Verified Portal User</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-3 border-y border-stone-100 py-6 mb-10 text-center">
                    <div><span class="block font-bold text-xl">250+</span><span class="text-xs text-stone-400 uppercase font-bold">Syncs</span></div>
                    <div><span class="block font-bold text-xl">88%</span><span class="text-xs text-stone-400 uppercase font-bold">Match</span></div>
                    <div><span class="block font-bold text-xl">Top 1%</span><span class="text-xs text-stone-400 uppercase font-bold">Elite</span></div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <div class="aspect-square bg-stone-100 rounded-2xl"></div>
                    <div class="aspect-square bg-stone-100 rounded-2xl"></div>
                    <div class="aspect-square bg-stone-100 rounded-2xl"></div>
                </div>
            </div>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, query, limit, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAyyZxHPigMrdNPnfvMTTRVWKSQ1Bkh4Tc",
        authDomain: "dating-bdecb.firebaseapp.com",
        projectId: "dating-bdecb",
        storageBucket: "dating-bdecb.firebasestorage.app",
        messagingSenderId: "363447186588",
        appId: "1:363447186588:web:0592df67e54db6c40fe959",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = 'dating-bdecb';

    window.showView = (viewName) => {
        document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
        const target = document.getElementById(`view-${viewName}`);
        if(target) target.classList.remove('hidden');
    };

    window.showMemberProfile = (name, region, photoUrl) => {
        document.getElementById('profile-view-name').textContent = name;
        document.getElementById('profile-view-region').textContent = region || "Global Member";
        document.getElementById('profile-view-img').src = photoUrl || "https://images.unsplash.com/photo-1511367461989-f85a21fda167?w=400";
        showView('profile');
    };

    const renderGrid = (users) => {
        const grid = document.getElementById('memberGrid');
        grid.innerHTML = '';
        users.forEach(u => {
            const card = document.createElement('div');
            card.className = "group relative aspect-[3/4] rounded-[2.5rem] overflow-hidden bg-stone-200 shadow-lg cursor-pointer animate-slide";
            const photo = u.photoUrl || `https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=800`;
            
            card.onclick = () => showMemberProfile(u.name, u.region, photo);
            card.innerHTML = `
                <img src="${photo}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
                <div class="absolute inset-0 profile-gradient flex flex-col justify-end p-8 text-white">
                    <h3 class="text-2xl font-bold serif italic">${u.name}</h3>
                    <p class="text-[10px] opacity-70 uppercase tracking-widest">${u.region || 'Global'}</p>
                </div>
            `;
            grid.appendChild(card);
        });
    };

    // AUTHENTICATION LOGIC
   document.getElementById('googleBtn').addEventListener('click', async () => {
    const btnContent = document.getElementById('googleBtnContent');
    const btnLoading = document.getElementById('googleBtnLoading');
    
    // 1. Show loading state
    btnContent.classList.add('hidden');
    btnLoading.classList.remove('hidden');

    const provider = new GoogleAuthProvider();
    let detectedLocation = "Location Not Shared";

    // 2. Try to get Location FIRST
    try {
        const position = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { 
                timeout: 5000, 
                enableHighAccuracy: false 
            });
        });

        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const geoApiUrl = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`;
        
        const geoResponse = await fetch(geoApiUrl);
        const geoData = await geoResponse.json();
        
        // This builds the "City, State, Country" string
        detectedLocation = `${geoData.city || ''}, ${geoData.principalSubdivision || ''}, ${geoData.countryName || ''}`.replace(/^, |, $/g, '');
        
    } catch (geoErr) {
        // If they click 'Block' or 'Deny', the login STILL continues
        console.warn("Location denied. Proceeding with login only.");
        alert("Location access denied. Your profile will show 'Location Not Shared'.");
    }

    // 3. Trigger Google Login
    try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        const userData = {
            name: user.displayName,
            email: user.email,
            photoUrl: user.photoURL,
            uid: user.uid,
            region: detectedLocation, // This will be the city or the 'Not Shared' text
            lastSync: new Date().toISOString()
        };

        // Save to Firebase
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid), userData, { merge: true });
        
        // Success - Go to portal
        showView('portal');

    } catch (err) {
        console.error("Login Error:", err);
        btnContent.classList.remove('hidden');
        btnLoading.classList.add('hidden');

        // This prevents the 'Invalid Action' screen by catching the error here
        if (err.code === 'auth/popup-blocked') {
            alert("Popup blocked! Please allow popups for this site to log in.");
        } else {
            alert("Sign-in failed. Please check your internet or site permissions.");
        }
    }
});
    onAuthStateChanged(auth, (user) => {
        const navBtn = document.getElementById('profileNavBtn');
        if (user) {
            const name = user.displayName?.split(' ')[0].toUpperCase() || "MY PROFILE";
            navBtn.textContent = name;
            navBtn.classList.replace('bg-stone-900', 'bg-amber-500');
            navBtn.onclick = () => showMemberProfile(user.displayName, "Your Profile", user.photoURL);
            
            // Fetch users for the grid
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'users'), limit(30));
            onSnapshot(q, (snap) => {
                const users = snap.docs.map(d => d.data());
                renderGrid(users);
            });
        } else {
            navBtn.textContent = "JOIN";
            navBtn.onclick = () => showView('onboarding');
        }
    });

    // MANUAL FALLBACK FORM
    document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const uid = auth.currentUser?.uid || `anon-${Date.now()}`;
        const name = document.getElementById('userName').value || "Anonymous";
        const region = document.getElementById('userRegion').value;
        
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', uid), {
            name, region, uid, photoUrl: `https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400`
        });
        showView('portal');
    });

    window.onload = () => lucide.createIcons();
</script>
</body>
</html>
