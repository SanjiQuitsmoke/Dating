<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Synthesis | Global Matchmaking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --gold: #d4af37; --deep-navy: #0f172a; }
        body { font-family: 'Inter', sans-serif; background-color: #f8f7f4; color: var(--deep-navy); scroll-behavior: smooth; }
        .serif { font-family: 'Playfair Display', serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .nav-offset { top: 56px; }
        @media (max-width: 640px) { .nav-offset { top: 52px; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="antialiased">

<!-- AD BANNER -->
<div class="fixed top-0 w-full z-[60] bg-amber-500 text-stone-900 py-2 px-4 text-center shadow-md">
    <p class="text-[10px] sm:text-xs font-black uppercase tracking-[0.2em]">Free Global Service | Ad-Supported Protocol</p>
</div>

<!-- NAV -->
<nav class="fixed w-full z-50 glass px-6 py-4 flex justify-between items-center nav-offset">
    <div class="text-xl md:text-2xl font-bold serif italic tracking-tight">The Synthesis.</div>
    <button onclick="toggleModal()" class="bg-stone-900 text-white px-6 py-2 rounded-full text-xs font-bold hover:bg-stone-700 transition shadow-lg">JOIN</button>
</nav>

<!-- HERO -->
<section class="relative min-h-screen flex items-center justify-center bg-stone-900 text-center px-6 pt-20 overflow-hidden">
    <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&q=80&w=2000" class="absolute inset-0 w-full h-full object-cover opacity-30 scale-105 transition-transform duration-1000">
    <div class="relative z-20 max-w-4xl">
        <h1 class="text-5xl md:text-8xl font-bold text-white mb-6 serif italic leading-tight animate-in">Unity Without Borders.</h1>
        <p class="text-lg md:text-xl text-stone-300 mb-10 max-w-xl mx-auto font-light leading-relaxed">High-value matchmaking bridging hearts in Ukraine, USA, Japan, and India.</p>
        <button onclick="toggleModal()" class="bg-white text-stone-900 px-10 py-4 rounded-full font-bold hover:scale-105 transition shadow-2xl">Start Free Journey</button>
    </div>
</section>

<!-- MODAL -->
<div id="joinModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-stone-900/95 backdrop-blur-md" onclick="toggleModal()"></div>
    <div class="relative bg-white w-full max-w-lg rounded-[2.5rem] shadow-2xl p-8 md:p-12 animate-in overflow-hidden">
        <div class="flex justify-between items-start mb-6">
            <h2 class="text-3xl font-bold serif italic text-stone-900">Join Synthesis</h2>
            <button onclick="toggleModal()" class="text-stone-300 hover:text-stone-900 transition-colors"><i data-lucide="x"></i></button>
        </div>
        
        <div id="statusMessage" class="hidden mb-6 p-4 rounded-2xl text-sm font-medium border animate-in"></div>
        
        <form id="onboardingForm" class="space-y-5">
            <div>
                <label class="text-[10px] font-bold text-stone-400 uppercase tracking-widest ml-1 mb-2 block">Full Legal Name</label>
                <input type="text" id="userName" placeholder="Name as per ID" class="w-full px-6 py-4 rounded-2xl border border-stone-100 bg-stone-50 focus:ring-2 focus:ring-amber-500 outline-none transition" required>
            </div>
            <div>
                <label class="text-[10px] font-bold text-stone-400 uppercase tracking-widest ml-1 mb-2 block">Your Region</label>
                <select id="userRegion" class="w-full px-6 py-4 rounded-2xl border border-stone-100 bg-stone-50 focus:ring-2 focus:ring-amber-500 outline-none transition" required>
                    <option value="">Select Region</option>
                    <option value="Ukraine">Ukraine</option>
                    <option value="United States">United States</option>
                    <option value="Japan">Japan</option>
                    <option value="India">India</option>
                </select>
            </div>
            <button type="submit" id="submitBtn" class="w-full py-5 bg-stone-900 text-white rounded-2xl font-bold hover:bg-stone-800 transition shadow-xl">CREATE PROFILE</button>
            
            <div class="relative py-2 flex items-center">
                <div class="flex-grow border-t border-stone-100"></div>
                <span class="px-4 text-[10px] font-bold text-stone-300 tracking-[0.2em]">OR SECURE VERIFY</span>
                <div class="flex-grow border-t border-stone-100"></div>
            </div>

            <button type="button" id="googleSignInBtn" class="w-full py-4 border-2 border-stone-100 rounded-2xl font-bold flex items-center justify-center gap-3 text-stone-700 hover:bg-stone-50 transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Sign in with Google
            </button>
        </form>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Configuration from your screenshot
    const firebaseConfig = {
        apiKey: "AIzaSyAh4pM5j66C3v87zM6uW8rLw4V2tQ_FmE", 
        authDomain: "dating-bdecb.firebaseapp.com",
        projectId: "dating-bdecb",
        storageBucket: "dating-bdecb.firebasestorage.app",
        messagingSenderId: "123018288540",
        appId: "1:123018288540:web:912f206126685b853510cb"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const statusEl = document.getElementById('statusMessage');
    const googleBtn = document.getElementById('googleSignInBtn');
    lucide.createIcons();

    window.toggleModal = () => {
        document.getElementById('joinModal').classList.toggle('hidden');
        statusEl.classList.add('hidden');
    };

    function showStatus(msg, type = 'success') {
        statusEl.textContent = msg;
        statusEl.className = `animate-in mb-6 p-4 rounded-2xl text-sm font-medium border ${type === 'error' ? 'bg-red-50 text-red-700 border-red-100' : 'bg-amber-50 text-amber-800 border-amber-100'}`;
        statusEl.classList.remove('hidden');
    }

    // Google Sign-In
    googleBtn.addEventListener('click', async () => {
        try {
            const provider = new GoogleAuthProvider();
            const result = await signInWithPopup(auth, provider);
            showStatus(`Signed in as ${result.user.displayName}. Please complete region info.`, 'success');
            document.getElementById('userName').value = result.user.displayName;
        } catch (error) {
            console.error(error);
            if (error.code === 'auth/unauthorized-domain') {
                showStatus("Error: Your URL isn't added to 'Authorized Domains' in Firebase console.", 'error');
            } else {
                showStatus("Login failed. Enable Google Sign-In in Firebase Authentication.", 'error');
            }
        }
    });

    // Form Submission to Firestore
    document.getElementById('onboardingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            if (!auth.currentUser) await signInAnonymously(auth);
            
            await addDoc(collection(db, 'artifacts', 'dating-bdecb', 'public', 'data', 'applications'), {
                name: document.getElementById('userName').value,
                region: document.getElementById('userRegion').value,
                timestamp: new Date().toISOString(),
                uid: auth.currentUser.uid
            });
            
            showStatus("Profile Created! Welcome to The Synthesis.", 'success');
            setTimeout(window.toggleModal, 2500);
        } catch (err) {
            console.error(err);
            showStatus("Error: Database access denied. Set up Firestore in your console.", 'error');
        }
    });
</script>
</body>
</html>
